[env]
lib_deps =
    knolleary/PubSubClient @ ^2.8.0
    adafruit/DHT sensor library @ ^1.4.7
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    claws/BH1750 @ ^1.3.0
    adafruit/Adafruit NeoPixel @ ^1.15.1
    bblanchon/ArduinoJson @ ~7.4.3
    ESP32Async/AsyncTCP @ ^3.5.0
    ESP32Async/ESPAsyncWebServer @ ^3.12.1
    tzapu/WiFiManager @ ^2.0.17

[env:lumen_esp32]
platform  = espressif32 @ 6.13.0
board     = esp32dev
framework = arduino

test_filter = test_esp32
test_build_src = yes

monitor_speed = 115200
upload_speed  = 921600

board_build.partitions = lumen_partitions.csv
board_build.filesystem = fatfs

; The Arduino-ESP32 builder adds -std=gnu++11 after build_flags, and the last -std wins.
; Remove it so that -std=gnu++17 below applies.
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1

[env:lumen_esp32_release]
extends   = env:lumen_esp32
test_filter = test_esp32
test_build_src = yes
; An option set here replaces the inherited one, so repeat the base unflags.
build_unflags =
    ${env:lumen_esp32.build_unflags}
    -DCORE_DEBUG_LEVEL=3
build_flags =
    ${env:lumen_esp32.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -O2

[env:native]
platform = native
test_filter = test_native
test_build_src = yes
build_flags =
    -std=gnu++17
    -Itest/native_shims
build_src_filter =
    -<*>
    +<lumen_type_validation.cpp>
    +<lumen_system_utils.cpp>
    +<lumen_auto_control.cpp>
    +<lumen_command_handler.cpp>
    +<lumen_wire.cpp>
    +<lumen_cloud_config.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ~7.4.3
